<!-- @dsCard group="Colors" viewport="700x160" name="Vivid Display Accents" subtitle="Hero & data-viz cards only — never as text-on-white" -->
<html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-body);background:#fff;padding:16px 20px;display:flex;gap:10px}
.card{flex:1;border-radius:20px;padding:16px;color:#fff}
.card .lbl{font-size:12px;opacity:0.75;margin-bottom:6px}
.card .val{font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-0.01em}
</style></head><body>
<div class="card" style="background:var(--vivid-profit)"><div class="lbl">Profit</div><div class="val">₦48,200</div></div>
<div class="card" style="background:var(--vivid-sale)"><div class="lbl">Sale</div><div class="val">₦62,000</div></div>
<div class="card" style="background:var(--vivid-expense)"><div class="lbl">Expense</div><div class="val">₦13,800</div></div>
